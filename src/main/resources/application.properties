spring.application.name=expense-tracker
# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assetmx}
spring.datasource.username=${DB_USERNAME:assetmx}
spring.datasource.password=${DB_PASSWORD:assetmx}
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080